[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lammps-analysis-tools"
version = "1.0.0"
description = "Trajectory analysis for LAMMPS data/dump files, with GROMACS-compatible commands"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [{name = "tgraphite"}]
keywords = [
    "molecular dynamics",
    "LAMMPS",
    "GROMACS",
    "trajectory analysis",
    "RDF",
    "hydrogen bonds",
    "free volume",
    "SASA",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pyyaml>=5.4",
    "matplotlib>=3.5",
    "MDAnalysis>=2.4",
    "ase>=3.22",
]

[project.urls]
Homepage = "https://github.com/tgraphite/LammpsAnalysisTools"
Documentation = "https://github.com/tgraphite/LammpsAnalysisTools/tree/main/docs/manual"
Repository = "https://github.com/tgraphite/LammpsAnalysisTools"
Issues = "https://github.com/tgraphite/LammpsAnalysisTools/issues"

[project.scripts]
lat = "lat.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lat = ["data/*.yaml", "data/manual/*.md"]
