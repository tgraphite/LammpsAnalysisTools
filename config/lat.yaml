# =============================================================================
# lat.yaml — 唯一配置来源（开发人员用，位于程序根目录）
# -----------------------------------------------------------------------------
# 规则（M11 + 决策18）：
#   * 本文件由开发人员维护，定义默认值/单位/文档入口/输出模板；用户不编辑它。
#   * 所有“物理”参数都必须同时有命令行开关；命令行覆盖本文件。
#   * 代码中不得出现任何 backup 默认值；本文件缺键/类型不符 → ERROR 中断。
#   * 单位：默认长度 Å（real/metal 都是 Å）；未显式给 unit 时报 INFO。
# =============================================================================

meta:
  version: 0.2.0
  units:                     # 内部统一单位
    length: Angstrom
    time: frame              # M2：时间即帧号，忽略 LAMMPS 时间字段
    mass: g/mol
    charge: e
    temperature: K
    density: kg/m^3
    diffusion: 1e-5 cm^2/s
    conductivity: S/m
  frame_interval: null       # 帧间距(ps)，仅用于“换算展示”寿命/滞留；null=只报帧数

io:
  # LAMMPS data/dump 文件都不携带 units/atom_style，必须显式或推断。
  default_unit: real         # real|metal|lj|si|cgs；未显式给 -unit 时用此值并报 INFO
                             #   5列=atomic, 7列=full；6列歧义需 -style
  pbc: true                  # 隐藏开关 -pbc；默认开
  unwrap: false              # msd/transport 显式打开
  triclinic: true
  backup_on_conflict: true   # 同名输出已存在 → 旧文件改名 .bak.1/.bak.2...

# type -> element：默认由质量 ±0.2% 匹配元素表推断；多解/无解 → ERROR。
# 需要时用户可用 -types 文件显式覆盖。
element_match_tolerance: 0.002

plot:
  smooth: none               # none|gaussian|savgol（只在 plot1d/plot2d 执行）
  savgol_window: 5
  savgol_order: 2
  gaussian_sigma: 1.0

output:
  # 命名：<basename>.<tag>.<mode>.out.csv（命名即意图）
  # 例：mysystem.rdf.cn.out.csv, mysystem.rg.out.csv, mysystem.rdf_Li_FSI.out.csv
  ext: csv
  suffix: out
  header_prefix: "#"
  atomic_write: true
  float_format: "%.6g"
  include_audit: true        # 默认审计信息写进文件头（不主动屏显）
  debug_json: false          # -debug 时额外落一份完整 JSON 审计（对外文档不暴露）

logger:
  # 不用退出码；只用 INFO/WARNING/ERROR 级别（ERROR 表示中断）。
  # 全部输出到 stderr，绝不污染 stdout/CSV。
  level: warning             # 默认只报 WARNING/ERROR；INFO 需 -v 才出
  stream: stderr

# vdW 半径（按元素符号，Å），freevol/sasa 用。
# 来源：reax_tools 的 ELEMENT_ATOMIC_RADII（Bondi 型）
#   /mnt/d/CurrentProjects/reax_tools/src/cpp/argparser.cpp:62
