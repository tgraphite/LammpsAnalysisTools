# 元素质量表（用于 type->element 质量匹配），来源：IUPAC 标准原子量（ase.data）。
# 注意：不可用 reax_tools 的 ELEMENT_MASS——其 Li=7.0 与 6.94 相差 0.86%，会超出 ±0.2%。
element_mass:
  H: 1.008
  C: 12.011
  N: 14.007
  O: 15.999
  F: 18.998403
  Li: 6.94
  P: 30.973762
  S: 32.06
  Cl: 35.45
  # 其余元素实现时以 ase.data 整表补全。

modules:
  rdf:
    help: docs/MANUAL_ALGORITHMS.md
    nbins: 200
    cutoff: 10.0             # Å（默认，限制计算量；不随盒子膨胀）
    intramolecular: false    # 默认排除同分子内对；-intramol 打开（true=包含分子内）
    normalization: number_density
    compute_coordination: true

  density:
    help: docs/MANUAL_ALGORITHMS.md
    dim: 1
    nbins: 200
    axis: z
    quantity: mass           # mass|number

  hbond:
    help: docs/MANUAL_ALGORITHMS.md
    distance: 3.5            # Å；对齐 gmx 默认（D···A, -da yes）
    distance_mode: DA        # DA（gmx 默认）| HA
    angle: 30                # deg；判据 D-H...A > 180-angle = >150
    nbins: 50
    compute_lifetime: true

  rms:
    help: docs/MANUAL_ALGORITHMS.md
    ref: first
    rmsf: true

  msd:
    help: docs/MANUAL_ALGORITHMS.md
    dim: 3                   # 3|2
    fit_range: null
    remove_com: true         # 默认去质心漂移
    seltype: atom            # atom | mol_com（对齐 gmx msd -seltype mol_com）

  agg:
    help: docs/MANUAL_ALGORITHMS.md
    mode: min                # min|center
    cutoff: null             # 必填：用户必须显式给（P0 决策）
    solv: null
    edge_conservation_tol: 0.02

  cluster:
    help: docs/MANUAL_ALGORITHMS.md
    mode: min
    cutoff: null             # 必填
    focus: false

  pistack:
    help: docs/MANUAL_ALGORITHMS.md
    distance: 5.5            # Å（沿用已验证代码的量纲换算）
    angle: 30

  freevol:
    help: docs/MANUAL_ALGORITHMS.md
    radius: 1.445            # Å；H2 动力学直径 2.89 Å 的一半
    mode: ffv                # ffv|psd|connectivity（网格分析需正交且固定盒）
    grid_dr: 0.5             # Å
    connectivity: 26         # 6|26；自由空间默认 26（6 连通固体的补集）
    psd_rmax: null           # Å；PSD 上界，null = 由数据决定
    components: false        # true 时另写逐分量表

  sasa:
    help: docs/MANUAL_ALGORITHMS.md
    radius: 1.445            # Å；探针半径
    sasa_points: 92          # Shrake-Rupley 球面采样点数

  residence:
    help: docs/MANUAL_ALGORITHMS.md
    mode: min
    cutoff: null             # 必填
    definition: both         # cont|inter|both

  transport:
    help: docs/MANUAL_ALGORITHMS.md
    require_velocity: true
    remove_com: true
    methods: [NE, GK]
    temperature: null        # K；NE/GK 需要（必需，故默认空）
    velocity_unit: A/ps      # dump 速度单位：A/ps | A/fs（LAMMPS units 不随文件传递）

  occupancy:
    help: docs/MANUAL_ALGORITHMS.md
    zone: null               # 必填；语义 -zone x/y/z:min-max[,min-max][ ...]
                             # 支持多维度：如 "-zone z:0-10,10-20 x:0-5"
                             # 后续 P2：以分子体积自动生成 zone

  gyrate:
    help: docs/MANUAL_ALGORITHMS.md

  contact:
    help: docs/MANUAL_ALGORITHMS.md
    mode: min
    cutoff: null             # 必填

  order:                     # P2：参考轴定义不确定，暂缓
    help: docs/MANUAL_ALGORITHMS.md
    axis: z
